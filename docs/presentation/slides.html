<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ISS Digital Twin · Slides</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/black.css" />

    <style>
      :root {
        --bg0: #03050a;
        --bg1: #070b16;
        --fg: rgba(248, 250, 252, 0.96);
        --muted: rgba(203, 213, 225, 0.72);
        --a1: rgba(255, 94, 197, 1);
        --a2: rgba(55, 214, 255, 1);
        --a3: rgba(255, 184, 77, 1);
        --card: rgba(12, 16, 32, 0.72);
        --cardBorder: rgba(132, 153, 220, 0.16);
      }

      .reveal {
        font-family: "Manrope", system-ui, -apple-system, Segoe UI, sans-serif;
        color: var(--fg);
      }

      .reveal .slides {
        text-align: left;
      }

      .reveal h1,
      .reveal h2,
      .reveal h3 {
        font-family: "Unbounded", "Manrope", system-ui, sans-serif;
        letter-spacing: -0.02em;
        text-transform: uppercase;
      }

      .reveal h2 {
        font-size: 56px;
        line-height: 1.02;
        margin: 0 0 14px;
        max-width: 14ch;
      }

      .reveal h3 {
        font-size: 18px;
        line-height: 1.15;
        margin: 0 0 10px;
        color: rgba(203, 213, 225, 0.84);
        letter-spacing: 0.18em;
      }

      .reveal .lead {
        font-size: 18px;
        line-height: 1.55;
        color: var(--muted);
        margin-top: 14px;
        max-width: 62ch;
      }

      .reveal .meta {
        margin-top: 10px;
        font-size: 14px;
        color: rgba(203, 213, 225, 0.6);
        letter-spacing: 0.02em;
      }

      .accent {
        background: linear-gradient(90deg, var(--a1), var(--a2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .kicker {
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(203, 213, 225, 0.66);
        margin-bottom: 10px;
      }

      .chips {
        margin-top: 18px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .chips span {
        border: 1px solid rgba(132, 153, 220, 0.18);
        background: rgba(10, 14, 28, 0.5);
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 12px;
        letter-spacing: 0.04em;
        color: rgba(241, 245, 249, 0.88);
      }

      .two {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px;
        margin-top: 18px;
      }

      .bullets {
        margin: 0;
        padding-left: 18px;
        color: rgba(241, 245, 249, 0.88);
      }

      .bullets li {
        margin: 10px 0;
        line-height: 1.45;
      }

      .footnote,
      .note {
        margin-top: 18px;
        color: rgba(203, 213, 225, 0.72);
        font-size: 14px;
        line-height: 1.5;
        max-width: 70ch;
      }

      .section {
        font-family: "Unbounded", "Manrope", system-ui, sans-serif;
        font-size: 52px;
        line-height: 1;
        background: linear-gradient(90deg, var(--a2), rgba(255, 255, 255, 0.08));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 8px;
      }

      .stat-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .stat-row {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin-top: 18px;
      }

      .stat {
        border: 1px solid var(--cardBorder);
        background: linear-gradient(180deg, rgba(12, 16, 32, 0.78), rgba(8, 12, 24, 0.62));
        border-radius: 18px;
        padding: 14px 16px;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
      }

      .stat span {
        display: block;
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(203, 213, 225, 0.62);
        margin-bottom: 8px;
      }

      .stat strong {
        display: block;
        font-size: 16px;
        line-height: 1.2;
        color: rgba(248, 250, 252, 0.96);
      }

      .stat.big strong {
        font-size: 18px;
      }

      .arch {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin-top: 18px;
      }

      .cardish {
        border: 1px solid var(--cardBorder);
        background: rgba(10, 14, 28, 0.5);
        border-radius: 18px;
        padding: 14px 16px;
      }

      .cardish div {
        margin: 10px 0;
        color: rgba(241, 245, 249, 0.88);
        line-height: 1.35;
      }

      .steps {
        margin: 18px 0 0;
        padding-left: 22px;
        color: rgba(241, 245, 249, 0.92);
      }

      .steps li {
        margin: 10px 0;
        line-height: 1.5;
      }

      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }

      /* Make backgrounds look like the reference PDF vibe */
      .reveal .slide-background-content {
        background-color: var(--bg0);
      }

      /* Smaller screens */
      @media (max-width: 980px) {
        .reveal h2 {
          font-size: 42px;
          max-width: none;
        }
        .two {
          grid-template-columns: 1fr;
        }
        .arch {
          grid-template-columns: 1fr;
        }
        .stat-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <div class="reveal">
      <div class="slides">
        <section data-markdown data-separator="^---$" data-separator-vertical="^--$" data-separator-notes="^Note:">
